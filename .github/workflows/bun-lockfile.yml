name: bun lockfile

# bun.lock is for faster local installs; CI and publishing still use npm and
# npm-shrinkwrap.json. Fails when package.json changes without bun.lock.
on:
  pull_request:
    paths:
      - package.json
      - npm-shrinkwrap.json
      - bun.lock
      - .github/workflows/bun-lockfile.yml

permissions:
  contents: read

jobs:
  bun-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
