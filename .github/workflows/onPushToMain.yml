name: Version, Tag and Publish to npm

on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # bump commit, push tags, create GitHub releases
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Ensures history is checked out for versioning

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Set to your Node.js version
        registry-url: 'https://registry.npmjs.org/'
      
    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Bump version and tag
      id: bump_version
      uses: phips28/gh-action-bump-version@fdad52b3b3bbe8fad96b8ca18c56127a96f603db # v11.0.7
      with:
        tag-prefix: 'v'  # Set this to 'v' if you want your tags like 'v1.0.0'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Explicitly Create and Push Tag
      run: |
        # Configure git
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Get version from package.json
        VERSION=$(node -p "require('./package.json').version")
        TAG="v$VERSION"
        
        echo "Creating and pushing tag: $TAG"
        
        # Check if tag exists locally
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists locally, skipping tag creation"
        else
          # Create tag
          git tag "$TAG" -m "Release $TAG"
        fi
        
        # Check if tag exists on remote
        if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
          echo "Tag $TAG already exists on remote, skipping tag push"
        else
          # Push tag to remote
          git push origin "$TAG"
        fi
      
    - name: Debug Version Output
      run: echo "New tag is ${{ steps.bump_version.outputs.newTag }}"
      
    - name: Create GitHub Release
      run: |
        if [ -n "${{ steps.bump_version.outputs.newTag }}" ]; then
          gh release create "${{ steps.bump_version.outputs.newTag }}" \
            --title "Release ${{ steps.bump_version.outputs.newTag }}" \
            --generate-notes
        else
          echo "No new tag was created, skipping release creation"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup NPM Authentication
      run: |
        echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    
    - name: Publish to npm
      continue-on-error: true
      run: |
        npm config set access public
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

    - name: Build standalone tarballs
      if: steps.bump_version.outputs.newTag != ''
      run: |
        npx oclif pack tarballs --targets darwin-x64,darwin-arm64,linux-x64

    - name: Rename tarballs and compute checksums
      if: steps.bump_version.outputs.newTag != ''
      id: tarballs
      run: |
        VERSION=$(node -p "require('./package.json').version")
        mkdir -p release-assets

        for target in darwin-x64 darwin-arm64 linux-x64; do
          # oclif produces files like apso-v0.8.6-<short-sha>-<target>.tar.gz
          src=$(ls dist/apso-v*-${target}.tar.gz 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo "No tarball found for ${target}, skipping"
            continue
          fi
          dest="release-assets/apso-v${VERSION}-${target}.tar.gz"
          cp "$src" "$dest"
          sha=$(shasum -a 256 "$dest" | awk '{print $1}')
          echo "sha_${target//-/_}=${sha}" >> "$GITHUB_OUTPUT"
          echo "${target}: ${sha}"
        done

    - name: Upload tarballs to GitHub Release
      if: steps.bump_version.outputs.newTag != ''
      run: |
        gh release upload "${{ steps.bump_version.outputs.newTag }}" release-assets/*.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Homebrew formula
      if: steps.bump_version.outputs.newTag != ''
      run: |
        VERSION=$(node -p "require('./package.json').version")
        SHA_DARWIN_ARM64="${{ steps.tarballs.outputs.sha_darwin_arm64 }}"
        SHA_DARWIN_X64="${{ steps.tarballs.outputs.sha_darwin_x64 }}"
        SHA_LINUX_X64="${{ steps.tarballs.outputs.sha_linux_x64 }}"

        git clone https://x-access-token:${{ secrets.HOMEBRE_TAP_TOKEN }}@github.com/apsoai/homebrew-tap.git /tmp/homebrew-tap-update
        cd /tmp/homebrew-tap-update

        cat > Formula/apso.rb << 'FORMULA'
        class Apso < Formula
          desc "CLI for the Apso backend-as-a-service platform"
          homepage "https://apso.ai"
          version "___VERSION___"
          license "MIT"

          on_macos do
            if Hardware::CPU.arm?
              url "https://github.com/apsoai/cli/releases/download/v#{version}/apso-v#{version}-darwin-arm64.tar.gz"
              sha256 "___SHA_DARWIN_ARM64___"
            elsif Hardware::CPU.intel?
              url "https://github.com/apsoai/cli/releases/download/v#{version}/apso-v#{version}-darwin-x64.tar.gz"
              sha256 "___SHA_DARWIN_X64___"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/apsoai/cli/releases/download/v#{version}/apso-v#{version}-linux-x64.tar.gz"
              sha256 "___SHA_LINUX_X64___"
            end
          end

          def install
            libexec.install Dir["*"]
            bin.install_symlink libexec/"bin/apso"
          end

          test do
            assert_match version.to_s, shell_output("#{bin}/apso --version")
          end
        end
        FORMULA

        sed -i "s/___VERSION___/${VERSION}/g" Formula/apso.rb
        sed -i "s/___SHA_DARWIN_ARM64___/${SHA_DARWIN_ARM64}/g" Formula/apso.rb
        sed -i "s/___SHA_DARWIN_X64___/${SHA_DARWIN_X64}/g" Formula/apso.rb
        sed -i "s/___SHA_LINUX_X64___/${SHA_LINUX_X64}/g" Formula/apso.rb
        sed -i 's/^        //' Formula/apso.rb

        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add Formula/apso.rb
        git commit -m "Update apso to ${VERSION}"
        git push
      env:
        HOMEBRE_TAP_TOKEN: ${{ secrets.HOMEBRE_TAP_TOKEN }}

