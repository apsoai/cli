name: run unit tests

on:
    pull_request:
        types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the Node bundled in the Homebrew tarballs; 22 is the oldest
        # supported line, kept for npm installs on older machines.
        node: ['22', '24']
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Ensures history is checked out for versioning

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node }}
        registry-url: 'https://npm.pkg.github.com'
        scope: '@mavric'
      
    - run: npm ci
    - run: npm run test


